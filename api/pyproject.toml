[project]
name = "talent-chat"
version = "0.1.0"
description = "Janus Soft recruiting assistant — Phase 1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "fastembed>=0.6",
  "pyyaml>=6.0",
  "python-multipart>=0.0.18",
  "tokenizers>=0.21",
  "boto3>=1.43.103",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
