<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151413" />
    <title>Offline · Recruiter Desk</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f7f4ee;
        color: #1d1c1a;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.45); }
      h1 { margin: 20px 0 6px; font: 400 26px/1.2 Georgia, "Times New Roman", serif; }
      p { margin: 0; color: rgba(29, 28, 26, 0.65); }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        background: #151413;
        color: #fff;
        font: inherit;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>The recruiter desk needs a connection to the office. Candidate data is never stored on this device. It opens again as soon as you are back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
